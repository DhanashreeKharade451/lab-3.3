<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">


  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body style="background-color: hsl(47, 88%, 63%); font-family: sans-serif;font-size: 15px; display: flex; justify-content: center; min-height: 100vh;align-items: center;display: grid; ">
  <main class="container" style="padding: 1rem;">
  
      <article class="card" style="background-color:hsl(0, 0%, 100%) ; padding: 16px; border-radius: 20px; text-align: center;">
        <img src="images/illustration-article.svg" alt="image" class="img" style="width: 100%; border-radius: 12px;margin-bottom: 16px;">

        <div>
          <span class="btn" style="background-color:hsl(47, 88%, 63%);color:rgb(12, 12, 12)  ;">Learning</span>
          <p class="date" style="font-size: 22px; font-weight: 700; color:hsl(218, 44%, 22%);margin-bottom: 12px ;">Published 21 Dec 2023</p>
          <h1 style="color: black; font-size: 25px;">HTML & CSS foundations</h1>
          <p class="para" style="font-size: 15px; font-weight: 400;color:hsl(216, 15%, 48%);line-height: 1.5 ;">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                     
        <div class="author d-flex align-items-center gap-2">
           <img src="images/image-avatar.webp" alt="Author image-avatar" style="width: 32px; height: 32px;border-radius: 50%;">
           <span>Greg Hooper</span>
        </div>
      </div>
      </article>
  
      
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Dhanashree</a>.
  </div>
</body>
</html>
